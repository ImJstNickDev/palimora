name: Release verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Playwright 1.56.1 supports this image; ubuntu-latest can advance independently.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zstd libzstd-dev libssl-dev g++
      - run: npm ci
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: ./scripts/verify-release.sh
      - run: APP_ORIGIN=https://palimora.example.test docker compose -f infra/compose.yaml build api web collector
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
