name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zstd libzstd-dev libssl-dev g++
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/verify.sh
      - run: APP_ORIGIN=https://palimora.example.test docker compose -f infra/compose.yaml build api web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
