name: palimora
services:
  metrics-proxy:
    build: { context: .., dockerfile: infra/Dockerfile, target: monitoring }
    command: [node, proxy.cjs]
    user: "0:0"
    environment:
      PALIMORA_PROJECT: ${COMPOSE_PROJECT_NAME:-palimora}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: { create_host_path: false }
    networks: [metrics]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  collector:
    build: { context: .., dockerfile: infra/Dockerfile, target: monitoring }
    networks: [metrics, app]
    environment:
      METRICS_PROXY_URL: http://metrics-proxy:9101
    depends_on: [metrics-proxy]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      NPM_TRUSTED_PROXY: ${NPM_TRUSTED_PROXY:-127.0.0.1}
    volumes:
      - type: bind
        source: ./nginx/gateway.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
    networks:
      app:
      frontend:
        aliases: [palimora-gateway]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    mem_limit: 128m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  web:
    build: { context: .., dockerfile: infra/Dockerfile, target: web }
    restart: unless-stopped
    networks: [app]
    mem_limit: 128m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    logging: *logging
  api:
    build: { context: .., dockerfile: infra/Dockerfile, target: api }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS origin}
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/database
      AUTH_KEY_FILE: /run/secrets/auth
      PROJECTION_CATALOG_BATCH: ${PROJECTION_CATALOG_BATCH:-20}
      PROJECTION_HISTORICAL_BATCH: ${PROJECTION_HISTORICAL_BATCH:-20}
      PROJECTION_TEXT_BATCH: ${PROJECTION_TEXT_BATCH:-16}
      PROJECTION_CONCURRENCY: ${PROJECTION_CONCURRENCY:-2}
      PROJECTION_BUDGET_MS: ${PROJECTION_BUDGET_MS:-100}
      PROJECTION_IDLE_MS: ${PROJECTION_IDLE_MS:-1000}
      PROJECTION_TEXT_HIGH_WATER: ${PROJECTION_TEXT_HIGH_WATER:-2048}
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/secrets/database
        target: /run/secrets/database
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/secrets/auth
        target: /run/secrets/auth
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/storage
        target: /storage
        read_only: true
        bind: { create_host_path: false }
    networks: [app]
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: ${API_MEMORY:-1536m}
    cpus: ${API_CPUS:-2}
    logging: *logging
  ingest:
    build: { context: .., dockerfile: infra/Dockerfile, target: api }
    command: [node, apps/api/dist/ingest-worker.js]
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS origin}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      DB_PASSWORD_FILE: /run/secrets/database
      AUTH_KEY_FILE: /run/secrets/auth
      ARCHIVE_RESERVE_BYTES: ${ARCHIVE_RESERVE_BYTES:-268435456}
      INGEST_GROUP_RECORDS: ${INGEST_GROUP_RECORDS:-256}
      INGEST_PARSER_WORKERS: ${INGEST_PARSER_WORKERS:-2}
      INGEST_COMMIT_CONCURRENCY: ${INGEST_COMMIT_CONCURRENCY:-2}
      UV_THREADPOOL_SIZE: ${INGEST_IO_THREADS:-8}
      ARCHIVE_ZSTD_LEVEL: ${ARCHIVE_ZSTD_LEVEL:-3}
      ARCHIVE_PACK_MIB: ${ARCHIVE_PACK_MIB:-64}
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/secrets/auth
        target: /run/secrets/auth
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/secrets/database
        target: /run/secrets/database
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/storage
        target: /storage
        bind: { create_host_path: false }
      - type: bind
        source: ${AO3_DUMP_ROOT:-/mnt/teratron_data/AO3_dumper/ao3_dump/data/ao3_stories}
        target: /dumps/ao3_stories
        read_only: true
        bind: { create_host_path: false }
    networks: [app, egress]
    depends_on:
      api: { condition: service_healthy }
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: ${INGEST_MEMORY:-1g}
    cpus: ${INGEST_CPUS:-2}
    logging: *logging
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
    volumes:
      - type: bind
        source: ./postgres-init.sh
        target: /docker-entrypoint-initdb.d/001-palimora.sh
        read_only: true
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/secrets/postgres
        target: /run/secrets/postgres
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/postgres
        target: /var/lib/postgresql/data
        bind: { create_host_path: false }
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/secrets/database
        target: /run/secrets/database
        read_only: true
        bind: { create_host_path: false }
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U palimora -d palimora"]
      interval: 5s
      timeout: 3s
      retries: 15
    shm_size: 256m
    mem_limit: ${POSTGRES_MEMORY:-1g}
    cpus: ${POSTGRES_CPUS:-2}
    logging: *logging
  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --appendfsync,
        everysec,
        --maxmemory,
        192mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/redis
        target: /data
        bind: { create_host_path: false }
    networks: [app]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *logging
  opensearch:
    image: opensearchproject/opensearch:2.19.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      node.store.allow_mmap: "false"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${SEARCH_HEAP:-1g} -Xmx${SEARCH_HEAP:-1g}
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT:-/mnt/sdb/palimora-data}/opensearch
        target: /usr/share/opensearch/data
        bind: { create_host_path: false }
    networks: [app]
    healthcheck:
      test:
        [
          CMD,
          curl,
          -fsS,
          "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s",
        ]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    mem_limit: ${SEARCH_MEMORY:-3g}
    cpus: ${SEARCH_CPUS:-2}
    logging: *logging
networks:
  metrics:
    internal: true
  app:
    name: palimora-app
    internal: true
  egress:
    driver: bridge
  frontend:
    name: prod-frontend
    external: true
